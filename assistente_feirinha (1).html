<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente da Feirinha — MPCE</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #BA7517;
  --laranja-claro: #FAEEDA;
  --laranja-medio: #EF9F27;
  --marrom: #412402;
  --vermelho: #C0392B;
  --verde: #3B6D11;
  --verde-claro: #EAF3DE;
  --bege: #FDF6E3;
  --bege-card: #FFFBF0;
  --borda: #FAC775;
  --texto: #2C1A04;
  --texto-sec: #7A5C2E;
  --sombra: rgba(65,36,2,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bege);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  width: 100%;
  background: var(--marrom);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.avatar-header {
  width: 38px; height: 38px;
  background: var(--laranja-medio);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.header-info h2 { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; }
.header-info p { font-size: 11px; color: var(--borda); }
.online-dot {
  width: 8px; height: 8px;
  background: #5BC95B; border-radius: 50%;
  display: inline-block; margin-right: 4px;
}
.header-badge {
  font-size: 11px; color: var(--laranja-claro);
  background: rgba(255,255,255,0.1);
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.15);
}

/* CHAT WRAPPER */
.chat-wrap {
  width: 100%; max-width: 600px;
  display: flex; flex-direction: column;
  height: calc(100vh - 62px);
}

/* MENSAGENS */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.25rem 1rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--borda); border-radius: 2px; }

.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg.bot { flex-direction: row; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  background: var(--laranja-medio);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}

.bubble {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--texto);
}
.msg.bot .bubble {
  background: #fff;
  border: 1px solid var(--borda);
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 4px var(--sombra);
}
.msg.user .bubble {
  background: var(--laranja);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.bubble b { font-weight: 700; }
.bubble a { color: var(--laranja); font-weight: 600; text-decoration: underline; }
.msg.user .bubble a { color: #ffe8b0; }

/* CHIPS DE OPÇÃO */
.chips-wrap {
  padding: 0.5rem 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  background: var(--bege-card);
  border: 1.5px solid var(--borda);
  color: var(--marrom);
  font-size: 13px;
  font-weight: 600;
  font-family: 'Nunito', sans-serif;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { background: var(--laranja-claro); border-color: var(--laranja); }
.chip:active { transform: scale(0.97); }

/* LINK CARD */
.link-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--laranja-claro);
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
  text-decoration: none;
  transition: background 0.15s;
}
.link-card:hover { background: #f5ddb0; }
.link-card-icon {
  width: 34px; height: 34px;
  background: var(--laranja);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.link-card-text { font-size: 13px; color: var(--marrom); font-weight: 600; line-height: 1.4; }
.link-card-sub { font-size: 11px; color: var(--texto-sec); font-weight: 400; }

/* STEP CARD */
.step-card {
  background: var(--bege-card);
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--texto);
}
.step-card .step-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--laranja);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.step-card ol { padding-left: 1.2rem; }
.step-card ol li { margin-bottom: 4px; }
.badge-validade {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  margin-top: 6px;
  font-weight: 600;
}
.badge-verde { background: var(--verde-claro); color: var(--verde); }
.badge-laranja { background: var(--laranja-claro); color: #7A4A00; }

/* INPUT AREA */
.input-area {
  padding: 0.75rem 1rem 1rem;
  background: var(--bege);
  border-top: 1px solid var(--borda);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-area textarea {
  flex: 1;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--borda);
  background: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  color: var(--texto);
  resize: none;
  max-height: 100px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.15s;
}
.input-area textarea:focus { border-color: var(--laranja); }
.input-area textarea::placeholder { color: #b0926a; }
.btn-send {
  width: 42px; height: 42px;
  background: var(--laranja);
  border: none;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
  font-size: 18px;
  color: white;
}
.btn-send:hover { background: var(--marrom); }
.btn-send:disabled { background: var(--borda); cursor: not-allowed; }

/* TYPING */
.typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; }
.typing span {
  width: 7px; height: 7px;
  background: var(--borda);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* PROGRESS BAR */
.progress-bar-wrap {
  padding: 0.5rem 1rem 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.progress-label { font-size: 11px; color: var(--texto-sec); font-weight: 600; white-space: nowrap; }
.progress-bar {
  flex: 1; height: 6px;
  background: var(--borda);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--laranja), var(--laranja-medio));
  border-radius: 3px;
  transition: width 0.5s ease;
}

@media(max-width: 600px) {
  .bubble { max-width: 88%; font-size: 13px; }
  .chip { font-size: 12px; padding: 6px 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">

<div class="chat-wrap">

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="chips-wrap" id="chips"></div>

  <div class="input-area">

// ── ESTADO ─────────────────────────────────────────────────────────────────
let currentDoc = -1;
let currentStep = 'menu';
let concluidosDocs = new Set();
let aguardandoResposta = false;

// ── FUNÇÕES DE UI ──────────────────────────────────────────────────────────
function scrollBottom() {
  const m = document.getElementById('messages');
  setTimeout(() => m.scrollTop = m.scrollHeight, 100);
}

function addMsg(text, type = 'bot', html = false) {
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'bot') {
    div.innerHTML = `<div class="msg-avatar">🌻</div><div class="bubble">${html ? text : escHtml(text)}</div>`;
  } else {
    div.innerHTML = `<div class="bubble">${html ? text : escHtml(text)}</div>`;
  }
  m.appendChild(div);
  scrollBottom();
}

function addCard(html) {
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="msg-avatar" style="visibility:hidden">🌻</div><div>${html}</div>`;
  m.appendChild(div);
  scrollBottom();
}

function showTyping() {
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">🌻</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  m.appendChild(div);
  scrollBottom();
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function setChips(chips) {
  const c = document.getElementById('chips');
  c.innerHTML = '';
  chips.forEach(({ label, action }) => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = label;
    btn.onclick = () => handleChip(action, label);
    c.appendChild(btn);
  });
}

function clearChips() { document.getElementById('chips').innerHTML = ''; }

function updateProgress() {
  const wrap = document.getElementById('progressWrap');
  const label = document.getElementById('progressLabel');
  const fill = document.getElementById('progressFill');
  if (concluidosDocs.size === 0 && currentDoc === -1) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  const total = DOCS.length;
  const done = concluidosDocs.size;
  label.textContent = `Documento ${done}/${total}`;
  fill.style.width = `${(done / total) * 100}%`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function botSay(text, delay = 600) {
  return new Promise(resolve => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMsg(text, 'bot', true);
      resolve();
    }, delay);
  });
}

// ── FLUXO PRINCIPAL ────────────────────────────────────────────────────────
async function startFlow() {
  await botSay('Olá! 👋 Seja bem-vindo ao <b>Assistente da Feirinha de Empreendedores do MPCE</b>!', 700);
  await botSay('Estou aqui para te ajudar a emitir cada documento necessário para participar da Feirinha. Vamos fazer isso juntos, um de cada vez. 😊', 1200);
  showMenu();
}

function showMenu() {
  currentStep = 'menu';
  const chips = DOCS.map((d, i) => ({
    label: `${concluidosDocs.has(i) ? '✅' : d.emoji} ${d.nome}`,
    action: `doc_${i}`
  }));
  chips.push({ label: '❓ Tenho outra dúvida', action: 'outra_duvida' });
  if (concluidosDocs.size === DOCS.length) {
    chips.push({ label: '🎉 Terminei tudo!', action: 'finalizado' });
  }

  const pendentes = DOCS.length - concluidosDocs.size;
  if (concluidosDocs.size === 0) {
    addMsg('Por qual documento quer começar? Pode escolher na ordem que preferir! 👇', 'bot', true);
  } else if (pendentes > 0) {
    addMsg(`Ótimo! Você já concluiu <b>${concluidosDocs.size}</b> de <b>${DOCS.length}</b> documentos. Qual quer fazer agora? 👇`, 'bot', true);
  } else {
    addMsg('Uau! Você concluiu <b>todos os documentos</b>! 🎉', 'bot', true);
  }
  setChips(chips);
}

async function showDoc(idx) {
  clearChips();
  currentDoc = idx;
  currentStep = 'doc_intro';
  const doc = DOCS[idx];

  await botSay(`Ótima escolha! Vamos emitir a <b>${doc.nome}</b> (${doc.orgao}). 📄`, 600);

  // Montar card com passos
  const passosHtml = doc.passos.map((p, i) => `<li>${p}</li>`).join('');
  const badgeClass = doc.validadeTipo === 'verde' ? 'badge-verde' : 'badge-laranja';
  let cardHtml = `<div class="step-card"><div class="step-title">Passo a passo</div><ol>${passosHtml}</ol><span class="badge-validade ${badgeClass}">${doc.validade}</span></div>`;
  if (doc.link) {
    cardHtml += `<a class="link-card" href="${doc.link}" target="_blank"><div class="link-card-icon">🔗</div><div class="link-card-text">${doc.linkLabel}<div class="link-card-sub">${doc.link.length > 45 ? doc.link.substring(0,45)+'...' : doc.link}</div></div></a>`;
  }

  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addCard(cardHtml);
      scrollBottom();
      setTimeout(() => {
        addMsg('Conseguiu abrir o site? Precisa de ajuda com algum dos passos? 😊', 'bot', true);
        const chips = doc.duvidas.map((d, i) => ({ label: d.p, action: `duvida_${idx}_${i}` }));
        chips.push({ label: '✅ Consegui emitir! Próximo documento', action: `concluir_${idx}` });
        chips.push({ label: '🔙 Voltar ao menu', action: 'menu' });
        setChips(chips);
        currentStep = 'doc_duvidas';
      }, 400);
    }, 900);
  }, 300);
}

async function handleChip(action, label) {
  clearChips();
  addMsg(label, 'user');

  if (action.startsWith('doc_')) {
    const idx = parseInt(action.split('_')[1]);
    await showDoc(idx);
    return;
  }

  if (action.startsWith('duvida_')) {
    const parts = action.split('_');
    const docIdx = parseInt(parts[1]);
    const duvIdx = parseInt(parts[2]);
    const duvida = DOCS[docIdx].duvidas[duvIdx];
    await botSay(duvida.r, 800);
    const chips = DOCS[docIdx].duvidas.map((d, i) => ({ label: d.p, action: `duvida_${docIdx}_${i}` }));
    chips.push({ label: '✅ Consegui emitir! Próximo documento', action: `concluir_${docIdx}` });
    chips.push({ label: '🔙 Voltar ao menu', action: 'menu' });
    setChips(chips);
    return;
  }

  if (action.startsWith('concluir_')) {
    const idx = parseInt(action.split('_')[1]);
    concluidosDocs.add(idx);
    updateProgress();
    const msgs = [
      'Arrasou! 🥳 Documento emitido com sucesso!',
      'Perfeito! Mais um documento na lista! ✅',
      'Que ótimo! Tá indo muito bem! 🌟',
      'Parabéns! Você está quase lá! 💪',
    ];
    await botSay(msgs[Math.floor(Math.random() * msgs.length)], 600);
    showMenu();
    return;
  }

  if (action === 'menu') {
    showMenu();
    return;
  }

  if (action === 'finalizado') {
    clearChips();
    await botSay('🎉 <b>Parabéns!</b> Você emitiu todos os documentos necessários!', 700);
    await botSay('Agora é só acessar o formulário oficial da Feirinha, preencher seus dados e fazer o upload de cada documento. Boa sorte e até a Feirinha! 🌻', 1200);
    addCard(`<a class="link-card" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=bzZrh2mlhk2wysS1YiPp8R7wfpVkz55Dp8fHRjSaL4NUNDk1Q1JEUDI3SUJRWVdZWUM0N1I4OUJJRi4u" target="_blank"><div class="link-card-icon">📝</div><div class="link-card-text">Ir para o formulário oficial<div class="link-card-sub">Microsoft Forms — MPCE</div></div></a>`);
    return;
  }

  if (action === 'outra_duvida') {
    const msg = encodeURIComponent('Olá! Preciso de ajuda com a Feirinha de Empreendedores do MPCE.');
    const waUrl = 'https://wa.me/5585985633675?text=' + msg;
    await botSay('Claro! Para dúvidas além dos documentos, nossa equipe vai te atender pelo WhatsApp. 😊 Digite sua dúvida abaixo e te conecto com o atendimento!', 600);
    currentStep = 'livre';
    return;
  }
}

// ── ENVIO LIVRE VIA API ────────────────────────────────────────────────────
async function sendUserMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autoResize(input);
  addMsg(text, 'user');
  clearChips();

  // Montar mensagem pré-preenchida para o WhatsApp
  const msg = encodeURIComponent('Olá! Preciso de ajuda com a Feirinha de Empreendedores do MPCE.

Minha dúvida: ' + text);
  const waUrl = 'https://wa.me/5585985633675?text=' + msg;

  showTyping();
  setTimeout(() => {
    hideTyping();
    addMsg('Entendido! 😊 Para te ajudar melhor, vou te conectar com nossa equipe de atendimento no WhatsApp. Clique no botão abaixo e já envie sua dúvida!', 'bot', true);
    addCard(`<a class="link-card" href="${waUrl}" target="_blank">
      <div class="link-card-icon" style="background:#25D366;font-size:22px">📲</div>
      <div class="link-card-text">Falar com a equipe no WhatsApp<div class="link-card-sub">Sua dúvida já estará pré-preenchida na mensagem</div></div>
    </a>`);
    setChips([
      { label: '📋 Voltar aos documentos', action: 'menu' },
      { label: '❓ Tenho outra dúvida', action: 'outra_duvida' },
    ]);
  }, 800);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendUserMessage(); }
});

// INIT
window.onload = () => startFlow();
</script>
